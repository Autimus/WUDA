services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wuda
      POSTGRES_USER: wuda
      POSTGRES_PASSWORD: local-demo-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuda -d wuda"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: local-demo-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: wuda
      POSTGRES_USER: wuda
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && gunicorn mysite.wsgi:application --bind 0.0.0.0:8000"
volumes:
  postgres_data:
