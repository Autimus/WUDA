name: Django CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository
        uses: actions/checkout@v4

      - name: Run docker compose
        run: docker compose up -d --build

      - name: Django check
        run: docker compose exec -T web python manage.py check

      - name: Django migration
        run: docker compose exec -T web python manage.py migrate --noinput

      - name: Turn off docker compose
        if: always()
        run: docker compose down -v