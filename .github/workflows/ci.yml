name: Django CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: python -m pip install ruff==0.11.13

      - name: Lint Python code
        run: ruff check manage.py mysite polls

      - name: Prepare environment configuration
        run: cp .env.example .env

      - name: Run docker compose
        run: docker compose up -d --build

      - name: Django check
        run: docker compose exec -T web python manage.py check

      - name: Django migration
        run: docker compose exec -T web python manage.py migrate --noinput

      - name: Run Django tests
        run: docker compose exec -T web python manage.py test

      - name: Turn off docker compose
        if: always()
        run: docker compose down -v
