name: Django CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Uruchom aplikację i bazę danych
        run: docker compose up -d --build

      - name: Sprawdź konfigurację Django
        run: docker compose exec -T web python manage.py check

      - name: Uruchom migracje
        run: docker compose exec -T web python manage.py migrate --noinput

      - name: Zatrzymaj kontenery
        if: always()
        run: docker compose down -v